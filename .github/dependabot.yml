version: 2

updates:
  # Keep GitHub Actions pinned to reviewed commit SHAs while receiving
  # weekly update proposals for the version comments in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
